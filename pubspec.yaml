name: ridiculous_fishing
description: Authentic 1:1 Ridiculous Fishing replica with animated spritesheets, Billy costumes, wood phone UI, Fish-o-pedia and weapon mechanics!
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/original_fish/
    - assets/phone/
    - assets/lures/
    - assets/billy/
    - assets/fonts/
  fonts:
    - family: 04B03
      fonts:
        - asset: assets/fonts/04B_03__.ttf
    - family: Villa
      fonts:
        - asset: assets/fonts/Villa.ttf
