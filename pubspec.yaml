name: ridiculous_fishing
description: Ridiculous Fishing authentic replica with original Vlambeer assets, physics and colors!
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/original_fish/
    - assets/fonts/
  fonts:
    - family: 04B03
      fonts:
        - asset: assets/fonts/04B_03__.ttf
    - family: Villa
      fonts:
        - asset: assets/fonts/Villa.ttf
